# vhost-admin: Verwaltungsoberfläche, nur lokal erreichbar
#
# Fremde Host-Header abweisen: per SSH-Tunnel (ssh -L 8080:...) weitergeleitet, kann eine
# beliebige Webseite im Browser per DNS-Rebinding auf 127.0.0.1:8080 zeigen und würde dann
# als gleicher Ursprung gelten, was den CSRF-Schutz umginge. Dieser default_server-Block
# fängt jeden Host-Header ab, der nicht "localhost" oder "127.0.0.1" lautet.
server {
    listen 127.0.0.1:8080 default_server;
    listen [::1]:8080 default_server;
    server_name _;
    return 444;
}

server {
    listen 127.0.0.1:8080;
    listen [::1]:8080;
    server_name localhost 127.0.0.1;
    root /var/www/localhost-8080;
    index index.php;
    access_log /var/log/nginx/vhost-admin.access.log;
    error_log  /var/log/nginx/vhost-admin.error.log;

    location / {
        try_files $uri /index.php?$args;
    }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_read_timeout 180s;
    }
}
