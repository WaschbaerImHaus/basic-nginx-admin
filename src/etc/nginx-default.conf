# Catch-all: unbekannte Hostnamen bekommen keine Antwort
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# Catch-all für HTTPS und HTTP/3: Ohne ihn bekäme ein unbekannter Name (SNI) das
# Zertifikat und die Antwort des ersten Hosts – und erführe dessen Namen.
# ssl_reject_handshake bricht schon den TLS-Handshake ab, ein Zertifikat braucht es dafür nicht.
# Sitzungs-Cache und -Dauer nimmt OpenSSL von diesem default_server, nicht vom per SNI
# gewählten Host – deshalb stehen hier dieselben Werte wie in den Host-Blöcken.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    listen 443 quic default_server;
    listen [::]:443 quic default_server;
    server_name _;
    ssl_reject_handshake on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    return 444;
}
